<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Chacha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="left-side">
            <img src="facebook.png" alt="Facebook Illustration">
        </div>
        <div class="right-side">
            <div class="login-card">
                <h2>Log in to Facebook</h2>
                <input class="email" type="text" placeholder="Email address or mobile number">
                <input class="password" type="password" placeholder="Password">
                <button class="login-btn">Log in</button>
                <a href="#" class="forgot-link">Forgotten password?</a>
                <div class="divider"></div>
                <button class="create-btn">Create new account</button>
                <div class="meta-footer"><span class="meta-icon">∞︎︎</span>Meta
                </div>
            </div>
        </div>
    </div>

</body>
</html>
